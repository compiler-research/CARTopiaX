name: clang-tidy-review

on:
  pull_request:
    paths:
      - '**.h'
      - '**.cpp'
      - '**.cc'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4

      - name: run git config command
        run: |
          git config --global --add safe.directory /github/workspace

      # Same artifact ci.yml consumes. This used to restore a BioDynaMo build
      # tree from a cache that ci.yml populated as a side effect of building it
      # inline; ci.yml now pulls a published artifact instead, so nothing writes
      # that cache and the restore failed on every run.
      - name: Set up BioDynaMo
        uses: compiler-research/ci-workflows/actions/setup-biodynamo@main
        with:
          version:       v1.05-cr-20260812-01
          os:            ubuntu-24.04
          arch:          x86_64
          build-on-miss: false

      - name: Run clang-tidy
        uses: ZedThree/clang-tidy-review@v0.20.1
        id: review
        with:
          build_dir: build
          apt_packages: >
            build-essential, cmake, curl, freeglut3-dev, g++, gcc, git,
            libblas-dev, libbz2-dev, libffi-dev, liblapack-dev, liblzma-dev,
            libncursesw5-dev, libnuma-dev, libomp-dev, libomp5, libopenmpi-dev,
            libpthread-stubs0-dev, libreadline-dev, libsqlite3-dev, libssl-dev,
            libxml2-dev, libxmlsec1-dev, make, python3-dev, python3-openssl,
            tk-dev, wget, xz-utils, zlib1g-dev,
            libgit2-dev, g++-11
          exclude: "test/*,unittests/*"
          split_workflow: true
          config_file: .clang-tidy
          # No pyenv: the recipe builds with -DNOPYENV=YES. thisbdm.sh derives
          # BDMSYS from its own location, so sourcing it inside this action's
          # container yields container-correct paths -- $GITHUB_ENV from the
          # step above would carry the runner's paths, which do not exist here.
          cmake_command: >
            bash -x -c '
            source $GITHUB_WORKSPACE/biodynamo/bin/thisbdm.sh &&
            cmake . -B build
            -DCMAKE_BUILD_TYPE="Release"
            -DCMAKE_EXPORT_COMPILE_COMMANDS=On || true'

      - name: Upload artifacts
        uses: ZedThree/clang-tidy-review/upload@v0.20.1

      - name: Setup tmate session
        if: ${{ !cancelled() && runner.debug }}
        uses: mxschmitt/action-tmate@v3
        # When debugging increase to a suitable value!
        timeout-minutes: 30
